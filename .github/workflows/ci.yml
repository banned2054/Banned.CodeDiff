name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Banned.CodeDiff.slnx

      - name: Build Release
        run: dotnet build Banned.CodeDiff.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test Banned.CodeDiff.slnx --configuration Release --no-build --no-restore
