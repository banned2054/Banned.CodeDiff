name: Publish NuGet packages

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.release_version.outputs.package_version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release and package versions
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          core_version="$(dotnet msbuild Banned.CodeDiff/Banned.CodeDiff.csproj -getProperty:Version -nologo)"
          avalonia_version="$(dotnet msbuild Banned.CodeDiff.Avalonia/Banned.CodeDiff.Avalonia.csproj -getProperty:Version -nologo)"

          if [[ "$RELEASE_TAG" != "v${tag_version}" ]]; then
            echo "::error::Release tag must start with v and contain the package version."
            exit 1
          fi

          if [[ "$tag_version" != "$core_version" || "$tag_version" != "$avalonia_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match both package versions (core: '$core_version', Avalonia: '$avalonia_version')."
            exit 1
          fi

          echo "package_version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Banned.CodeDiff.slnx

      - name: Build Release
        run: dotnet build Banned.CodeDiff.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test Banned.CodeDiff.slnx --configuration Release --no-build --no-restore

      - name: Pack core and Avalonia packages
        run: |
          dotnet pack Banned.CodeDiff/Banned.CodeDiff.csproj --configuration Release --no-build --no-restore --output artifacts
          dotnet pack Banned.CodeDiff.Avalonia/Banned.CodeDiff.Avalonia.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish core package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build-and-pack.outputs.package_version }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/Banned.CodeDiff.${PACKAGE_VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Publish Avalonia package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build-and-pack.outputs.package_version }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/Banned.CodeDiff.Avalonia.${PACKAGE_VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
